<section class="sd-logos" lang="de" aria-label="Förderung und Projektpartner">
    <style>
        .sd-logos { display: flex; flex-basis: 100%; justify-content: flex-start; margin-right: auto; max-width: calc(100vw - 2rem); }
        .sd-logos > div {
            align-items: center;
            background: #fff;
            border-radius: .4rem;
            color: #333;
            display: flex;
            flex-wrap: wrap;
            font-size: .8rem;
            gap: .5rem 1.1rem;
            justify-content: flex-start;
            padding: .5rem .9rem;
        }
        body.light .sd-logos > div { padding-inline: 0; }
        .sd-logos p { align-items: center; display: flex; gap: .6rem; margin: 0; }
        .sd-logos a { border-radius: .2rem; display: block; }
        .sd-logos a:hover { opacity: .75; }
        .sd-logos a:focus-visible { outline: .15rem solid #333; outline-offset: .2rem; }
        .sd-logos img { height: 2.25rem; width: auto; }
        .sd-logos .sd-partner { border-left: 1px solid #ccc; padding-left: 1.1rem; }
        @media (width < 34rem) {
            .sd-logos .sd-partner { border-left: none; padding-left: 0; }
        }
    </style>
    <div>
        <p>
            <span>Gefördert von</span>
            <a href="https://www.netidee.at/" target="_blank" rel="noopener">
                <img src="@ROOT@assets/logos/netidee.png" alt="netidee – gefördert von netidee" width="145" height="36">
            </a>
        </p>
        <p class="sd-partner">
            <span>Umgesetzt von</span>
            <a href="https://www.ustp.at/" target="_blank" rel="noopener">
                <img src="@ROOT@assets/logos/ustp.png" alt="USTP – University of Applied Sciences St. Pölten" width="132" height="36">
            </a>
            <a href="https://gebaerdenverse.at/" target="_blank" rel="noopener">
                <img src="@ROOT@assets/logos/gebaerdenverse.png" alt="Gebärdenverse" width="36" height="36">
            </a>
        </p>
    </div>
</section>
